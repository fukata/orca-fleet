# OPTIONAL drop-in for an existing orca-serve.service (not installed automatically).
# Copy to /etc/systemd/system/orca-serve.service.d/ and `systemctl daemon-reload`
# — no restart needed; it applies at the next (re)start.
#
# Exit 3  = another Orca already serves this profile (or cannot be shown stopped)
# Exit 78 = host not equipped (EX_CONFIG)
# Restarting on either only loops; Orca documents both for RestartPreventExitStatus.
[Service]
RestartPreventExitStatus=3 78
